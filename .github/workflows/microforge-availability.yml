name: MicroForge production availability
# Wakes the free Render instance with GET requests. No payments or users created.
on:
  schedule:
    - cron: '2-59/5 * * * *' # Avoid GitHub scheduler congestion at minute 0
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/microforge-availability.yml'
permissions:
  contents: read
concurrency:
  group: microforge-availability
  cancel-in-progress: false
jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Render and verify storefront plus durable billing
        env:
          BASE_URL: https://microforge.onrender.com
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request
          import urllib.error

          base = os.environ["BASE_URL"].rstrip("/")
          def fetch(route):
              req = urllib.request.Request(
                  base + route,
                  headers={"User-Agent": "MicroForge-Availability/1.0", "Cache-Control":"no-cache"},
              )
              with urllib.request.urlopen(req, timeout=35) as res:
                  return res.status, res.read(300_000).decode("utf-8", errors="replace")

          def wait_for(route, verify, attempts=8, pause=15):
              for index in range(1, attempts + 1):
                  try:
                      status, data = fetch(route)
                      if status == 200 and verify(data):
                          print(f"PASS {route}: HTTP 200 (attempt {index})")
                          return
                      print(f"RETRY {route}: invalid response (attempt {index})")
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
                      print(f"RETRY {route}: {type(exc).__name__} (attempt {index})")
                  except (json.JSONDecodeError, ValueError):
                      print(f"RETRY {route}: invalid JSON (attempt {index})")
                  if index < attempts:
                      time.sleep(pause)
              print(f"FAIL {route}: not healthy")
              sys.exit(1)

          def health_ok(s):
              d=json.loads(s)
              return (
                  d.get("ok") is True
                  and d.get("apps") == 50
                  and d.get("storage") == "supabase"
                  and d.get("paymentsReady") is True
              )

          def paddle_config_ok(s):
              d=json.loads(s)
              return (
                  d.get("enabled") is True
                  and d.get("environment") == "live"
                  and bool(d.get("clientToken"))
                  and all(bool((d.get("prices") or {}).get(p)) for p in ("mini","basic","pro","monthly"))
              )

          wait_for("/health", health_ok)
          wait_for("/api/payments/paddle/config", paddle_config_ok, attempts=2)
          wait_for("/pricing", lambda html: "Simple credits for automation" in html and 'id="payment-status"' in html, attempts=2)
          wait_for("/tools/json-validator", lambda html: 'data-tool="json-validator"' in html, attempts=2)
          print("PASS: Storefront and server-side payment/persistence readiness verified; no charge made.")
          PY
